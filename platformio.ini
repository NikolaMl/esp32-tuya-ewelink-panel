; ESP32 Tuya & eWeLink Panel — ESP32-S3 5" 800x480 (Guition JC8048W550 / Sunton ESP32-8048S050)
; Kontrola Tuya (Smart Life) i eWeLink (Sonoff) prekidača direktno preko cloud API-ja.

[platformio]
default_envs = panel

[env:panel]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3R8: 16 MB QIO flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 5242880  ; app0 u partitions.csv (5 MB)
board_build.partitions = partitions.csv
; Pozadina početnog ekrana (800x480 RGB565) — pravi je tools/make_background.py
board_build.embed_files = assets/background.rgb565
board_build.f_cpu = 240000000L

; CH340 na macOS-u pouzdano radi tek na 230400 (921600 i 460800 pucaju)
upload_speed = 230400
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
build_unflags =
    -std=gnu++11
